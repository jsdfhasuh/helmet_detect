name: Offline validation tools
on:
  push:
    branches: [fix/early-helmet-inference]
    paths: [.github/workflows/local-validation-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: --no-deps ruff==0.16.6 --dest tooling
      - uses: actions/upload-artifact@v4
        with:
          name: lint-tool
          path: tooling/
          retention-days: 1
