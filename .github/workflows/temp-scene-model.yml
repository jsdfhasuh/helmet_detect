name: Temporary scene model download

on:
  push:
    branches: ["refactor/dynamic-v2"]
    paths:
      - ".github/workflows/temp-scene-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download official YOLO11n ONNX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.onnx" \
            --output model/yolo11n.onnx
          echo "634279b40c07c6391472c51ad45b81ebc48706a9a1fe72dd3396322acd0c053b  model/yolo11n.onnx" | sha256sum -c -
          sha256sum model/yolo11n.onnx > model/SHA256SUMS.txt
          ls -lh model
      - name: Upload scene model
        uses: actions/upload-artifact@v4
        with:
          name: yolo11n-scene-model
          path: model/
          retention-days: 1
          compression-level: 0
