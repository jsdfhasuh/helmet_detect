name: Temporary source export for local video test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-export-source-for-local-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: helmet-detect-main-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
          compression-level: 6
