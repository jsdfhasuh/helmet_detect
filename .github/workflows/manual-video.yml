name: Manual dynamic video detection

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct-download video URL. Leave blank to run the privacy-safe repository fixture."
        required: false
        type: string
      sample_fps:
        description: "Inference sampling FPS (5-10 recommended for real video)"
        required: true
        default: "5"
        type: string
      show_contexts:
        description: "Draw per-person dynamic context crops"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore verified PT models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            models/yolo11n.pt
            models/helmet_yolov8n.pt
            models/dynamic_model_sources.json
            models/DYNAMIC_SHA256SUMS.txt
          key: dynamic-helmet-pt-v3-${{ hashFiles('scripts/prepare_dynamic_models.py') }}

      - name: Install dynamic runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dynamic]"

      - name: Download and verify models on cache miss
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_dynamic_models.py

      - name: Select or build input video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p artifacts/manual
          if [ -n "$VIDEO_URL" ]; then
            INPUT_VIDEO="artifacts/manual/input.mp4"
            CONFIG_PATH="configs/dynamic_full_frame.json"
            curl --fail --location --retry 5 --retry-all-errors \
              "$VIDEO_URL" --output "$INPUT_VIDEO"
          else
            python scripts/run_dynamic_regression.py \
              --output artifacts/manual/fixture-regression
            INPUT_VIDEO="artifacts/manual/fixture-regression/video/input.avi"
            CONFIG_PATH="configs/dynamic_regression_all_persons.json"
          fi
          test -s "$INPUT_VIDEO"
          echo "INPUT_VIDEO=$INPUT_VIDEO" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Run full-frame dynamic detector
        shell: bash
        run: |
          CONTEXT_FLAG=""
          if [ "${{ inputs.show_contexts }}" = "true" ]; then
            CONTEXT_FLAG="--show-contexts"
          fi
          helmet-detect video \
            --config "$CONFIG_PATH" \
            --source "$INPUT_VIDEO" \
            --output artifacts/manual/annotated.mp4 \
            --records artifacts/manual/frames.jsonl \
            --summary artifacts/manual/summary.json \
            --sample-fps "${{ inputs.sample_fps }}" \
            $CONTEXT_FLAG \
            --fail-on-no-alarm

      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/manual/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/manual/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-dynamic-helmet-detection-${{ github.run_number }}
          path: |
            artifacts/manual/annotated.mp4
            artifacts/manual/frames.jsonl
            artifacts/manual/summary.json
            artifacts/manual/annotated_events/
            artifacts/manual/fixture-regression/
          if-no-files-found: warn
          retention-days: 7
