name: Apply V3 rider detection patch

on:
  push:
    branches: ["feat/v3-rider-dedup-dual-threshold"]
    paths:
      - ".github/workflows/apply-v3-patch.yml"
      - ".github/patches/v3.patch.xz.b64.part*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v3-rider-dedup-dual-threshold
          fetch-depth: 0

      - name: Reconstruct, verify, and apply V3 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/v3.patch.xz.b64.part* | base64 -d > /tmp/v3.patch.xz
          echo "eca9823b4d7533f7665511c8962f9d19aade06b7f9a079b709f1b67e71713fa5  /tmp/v3.patch.xz" | sha256sum -c -
          xz -dc /tmp/v3.patch.xz > /tmp/v3.patch
          echo "3ef5292fcce913fe6554ce27bbb228fca0185bfaf77ea23a7153b1f241359bf5  /tmp/v3.patch" | sha256sum -c -
          git apply --check \
            --exclude=.github/workflows/ci.yml \
            --exclude=.github/workflows/manual-video.yml \
            /tmp/v3.patch
          git apply --index \
            --exclude=.github/workflows/ci.yml \
            --exclude=.github/workflows/manual-video.yml \
            /tmp/v3.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add cross-ID dedup, rider-only mode and dual-threshold alarms"
          git push origin HEAD:feat/v3-rider-dedup-dual-threshold
