name: CI

on:
  push:
    branches:
      - main
      - refactor/dynamic-v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helmet-detect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[runtime,dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  dynamic-model-regression:
    name: Dynamic full-frame model regression
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore verified PT models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            models/yolo11n.pt
            models/helmet_yolov8n.pt
            models/dynamic_model_sources.json
            models/DYNAMIC_SHA256SUMS.txt
          key: dynamic-helmet-pt-v3-${{ hashFiles('scripts/prepare_dynamic_models.py') }}

      - name: Install dynamic runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dynamic,dev]"

      - name: Download and verify model weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_dynamic_models.py

      - name: Verify expected model files exist
        run: |
          test -s models/yolo11n.pt
          test -s models/helmet_yolov8n.pt
          test -s models/dynamic_model_sources.json
          test -s models/DYNAMIC_SHA256SUMS.txt

      - name: Run position-invariant image and per-track video regression
        run: python scripts/run_dynamic_regression.py

      - name: Publish regression summary
        if: always()
        run: |
          if [ -f artifacts/dynamic-regression/summary.md ]; then
            cat artifacts/dynamic-regression/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload visual evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-helmet-regression-${{ github.run_number }}
          path: artifacts/dynamic-regression/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
