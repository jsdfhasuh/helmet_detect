name: Temporary Python 3.13 runtime wheels

on:
  push:
    branches: ["temp/video-test-runtime"]
    paths:
      - ".github/workflows/temp-export-python313-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download only the missing runtime wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p wheels
          python -m pip download --only-binary=:all: --no-deps --dest wheels \
            "ultralytics==8.4.79" \
            "ultralytics-thop>=2.0.18" \
            "lap>=0.5.12" \
            "nvidia-ml-py>=12.0.0"
          python -m pip download --only-binary=:all: --dest wheels "polars>=0.20.0"
          ls -lh wheels
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python313-ultralytics-runtime-wheels
          path: wheels/
          retention-days: 1
          compression-level: 0
