[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helmet-detect"
version = "0.3.0"
description = "Dynamic rider-only helmet detection with cross-ID de-duplication and dual-threshold alarms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jiahao Cai" }
]
dependencies = [
  "numpy==2.3.5",
]

[project.optional-dependencies]
runtime = [
  "opencv-python-headless==4.13.0.92",
]
dynamic = [
  "ultralytics==8.4.79",
  "lap>=0.5.12",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]
export = [
  "ultralytics==8.4.79",
  "onnx>=1.17,<2",
  "onnxslim>=0.1.59",
]

[project.scripts]
helmet-detect = "helmet_detect.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
